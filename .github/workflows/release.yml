name: Release

# One job does the whole release, and every step can be rerun safely:
#   1. A version in packages/*/package.json that npm does not have yet (after merging
#      a release pull request): build it and publish it with trusted publishing (OIDC),
#      so no npm token is stored in the repository. Each package is checked on its own,
#      so a rerun after a partial publish ships only the missing one.
#   2. Create the GitHub release vX.Y.Z from the CHANGELOG.md sections.
#   3. Pending changesets: open or update the "chore: release vX.Y.Z" pull request,
#      from branch release/vX.Y.Z, that bumps @vivari/core and @vivari/react together
#      and writes their CHANGELOG.md.
#
# Publishing comes first and does not wait for the changesets to run out: a run that
# was cancelled or failed after a release PR merged must not be skipped for good by
# the next PR that brings a changeset.
#
# npmjs.com must list this file (release.yml) as the trusted publisher of both
# packages; renaming it breaks publishing until that setting is changed too.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # A dispatch from another branch would publish that branch's versions.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The release notes compare against the previous v* tag.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      # Every step of this job can mint the OIDC token npm accepts for publishing, so
      # the dependency tree's install scripts do not run here at all.
      - run: npm ci --ignore-scripts

      - id: plan
        name: Decide what to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          react="$(node -p "require('./packages/react/package.json').version")"
          if [ "$react" != "$version" ]; then
            echo "::error::@vivari/core is $version but @vivari/react is $react; they are released together"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=false
          for name in @vivari/core @vivari/react; do
            key="publish_${name#@vivari/}"
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$key=false" >> "$GITHUB_OUTPUT"
              echo "$name@$version is already on npm"
            else
              echo "$key=true" >> "$GITHUB_OUTPUT"
              publish=true
            fi
          done
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "GitHub release v$version already exists"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          case "$version" in
            *-*) echo "tag=next" >> "$GITHUB_OUTPUT"; echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=latest" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # The SDK bundles three Wasm crates (VFS, codec, crypto) as assets.
      - name: Setup Rust
        if: steps.plan.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        if: steps.plan.outputs.publish == 'true'
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - name: Cache cargo
        if: steps.plan.outputs.publish == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/*/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/*/Cargo.lock') }}

      # With dist built, the smoke test's runtime leg imports the bundled ESM and
      # exercises the public API before anything is published.
      - name: Build and check the packages
        if: steps.plan.outputs.publish == 'true'
        run: |
          npm run build:vfs
          npm run build:codec
          npm run build:crypto
          npm run build:sdk
          npm run smoke

      # @vivari/react names @vivari/core as a peer, so core goes first. Nothing waits for
      # npm to make them installable: its automated review held core 1.1.0 in
      # "Validating" for over an hour, and npm view does not see a version until then.
      # So a rerun in that window publishes it again, and "previously published" means
      # npm has it.
      - name: Publish @vivari/core to npm
        if: steps.plan.outputs.publish_core == 'true'
        run: |
          npm publish --workspace @vivari/core --access public --provenance --tag "${{ steps.plan.outputs.tag }}" 2>&1 \
            | tee "$RUNNER_TEMP/npm.log" || grep -q "previously published" "$RUNNER_TEMP/npm.log"
      - name: Publish @vivari/react to npm
        if: steps.plan.outputs.publish_react == 'true'
        run: |
          npm publish --workspace @vivari/react --access public --provenance --tag "${{ steps.plan.outputs.tag }}" 2>&1 \
            | tee "$RUNNER_TEMP/npm.log" || grep -q "previously published" "$RUNNER_TEMP/npm.log"

      - name: Create the GitHub release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          # The tag goes on the commit that set the version (the merged release PR), not
          # on whatever later push ran this job after an earlier run failed.
          target="$(git log -1 --first-parent --diff-merges=first-parent -s --format=%H -G'"version":' -- packages/core/package.json)"
          node scripts/release-notes.mjs "$VERSION" "$target" > "$RUNNER_TEMP/notes.md"
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "v$VERSION" --target "$target" --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"

      # The release PR commits the whole working tree, so nothing the build wrote may
      # be tracked.
      - name: The working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::the build left changes the release PR would commit"
            exit 1
          fi

      # Last, because it moves the working tree onto the release branch. The branch and
      # the title name the version (release/v1.2.3, "chore: release v1.2.3"); when more
      # changesets move the version, the PR for the old one is closed for the new one.
      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          # @changesets/changelog-github reads it to link each entry to its PR and author.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Only this repository's branches: a fork's PR can come from a branch of the same name.
          open="$(gh pr list --state open --base master --limit 100 --json number,headRefName,isCrossRepository \
            --jq '.[] | select((.isCrossRepository | not) and (.headRefName | startswith("release/v"))) | "\(.number) \(.headRefName)"')"
          if [ -z "$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md)" ]; then
            echo "No pending changesets."
            while read -r number head; do
              if [ -n "$number" ]; then
                gh pr close "$number" --delete-branch --comment "No changesets are pending any more."
              fi
            done <<< "$open"
            exit 0
          fi

          npm run version-packages
          version="$(node -p "require('./packages/core/package.json').version")"
          branch="release/v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -q -m "chore: release v$version"
          git push --force origin "$branch"

          {
            echo "Merging this pull request publishes \`@vivari/core\` and \`@vivari/react\` v$version to npm"
            echo "and creates the GitHub release below. More changesets merged before then are added here."
            echo
            echo "---"
            echo
            node scripts/release-notes.mjs "$version"
          } > "$RUNNER_TEMP/pr.md"
          title="chore: release v$version"
          number="$(gh pr list --state open --head "$branch" --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/pr.md"
          else
            url="$(gh pr create --base master --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr.md")"
            number="${url##*/}"
          fi
          while read -r old head; do
            if [ -n "$old" ] && [ "$head" != "$branch" ]; then
              gh pr close "$old" --delete-branch --comment "Superseded by #$number (v$version)."
            fi
          done <<< "$open"